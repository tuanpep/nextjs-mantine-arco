# Local Keycloak for dx-support-fe (dev only).
# Start: docker compose -f docker/keycloak/docker-compose.yml up -d
# Admin console: http://localhost:8180 (admin / admin)
# App login user: demo / demo
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      # Hostname for browser redirects from the Next.js app
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8180
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY_HEADERS: xforwarded
    ports:
      # 8080 is often taken locally; expose on 8180
      - "8180:8080"
    volumes:
      - ./realm-dx-support.json:/opt/keycloak/data/import/realm-dx-support.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
